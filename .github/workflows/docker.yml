name: Publish Docker image

# Builds the Caelo image and pushes it to the GitHub Container Registry.
# Runs when a GitHub Release is published, or when a version tag (v*) is pushed.
# Authentication uses the built-in GITHUB_TOKEN, so no manual credentials are needed.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege: nothing by default, and only this job may write packages.
permissions: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release identity and derive image tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node .github/image-tags.mjs

      - name: Build and push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
